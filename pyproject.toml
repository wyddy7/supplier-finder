[project]
name = "supplier-finder"
version = "0.1.0"
description = "Find and compare food suppliers (ingredients, finished goods, packaging) by category and city, with a source for every fact."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.47",
    "pydantic>=2.8",
    "selectolax>=1.0",
]

[project.scripts]
supplier-finder = "supplier_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplier_finder"]

[dependency-groups]
dev = ["pytest>=8"]
